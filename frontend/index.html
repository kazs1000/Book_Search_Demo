<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Search Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <p class="eyebrow">Book search</p>
        <h1>古本検索</h1>
        <p class="description">
          AWS, Terraform学習用
        </p>
      </section>

      <form id="search-form" class="search-form">
        <label for="search-input">検索キーワード</label>
        <div class="search-row">
          <input
            id="search-input"
            name="q"
            type="search"
            placeholder="例: terraform"
            autocomplete="off"
            required
          />
          <button type="submit">検索</button>
        </div>
      </form>

      <section id="message" class="message" aria-live="polite"></section>
      <section id="site-status" class="site-status" aria-live="polite"></section>
      <section id="results" class="results"></section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
